name: Build integrated native clients
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - 'tools/native_sources.py'
      - 'tools/smoke_desktop.py'
      - 'tools/package_linux.py'
      - 'tools/source_bundle.py'
      - 'tools/smoke_windows.ps1'
      - 'deploy/install_client_linux.py'
      - '.github/workflows/native-clients.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/native_sources.py moonlight-android --sync
      - name: Preserve corresponding client sources and notices
        run: python3 tools/source_bundle.py moonlight-android --output dist/CloudGame-Android-sources.tar.gz --notices third_party/moonlight-android/app/src/main/assets/source-notices
      - name: Build APK with embedded native decoder
        working-directory: third_party/moonlight-android
        run: sh gradlew assembleNonRootDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-game-android-debug-internal
          path: |
            third_party/moonlight-android/app/build/outputs/apk/nonRoot/debug/*.apk
            dist/CloudGame-Android-sources.tar.gz
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/native_sources.py moonlight-qt --sync
      - name: Preserve corresponding client sources and notices
        run: python3 tools/source_bundle.py moonlight-qt --output dist/CloudGame-Desktop-sources.tar.gz --notices build/desktop-notices
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev-tools libsdl2-dev libsdl2-ttf-dev libssl-dev libopus-dev libavcodec-dev libavutil-dev libswscale-dev libva-dev libvdpau-dev libegl1-mesa-dev libdrm-dev libx11-dev libxcb1-dev qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick xvfb imagemagick
      - name: Compile integrated desktop client
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake6 ../../third_party/moonlight-qt/moonlight-qt.pro CONFIG+=release
          make -j2
      - name: Check desktop startup
        run: xvfb-run -a python3 tools/smoke_desktop.py build/linux/app/moonlight
      - name: Package Linux client
        run: python3 tools/package_linux.py build/linux/app/moonlight
      - name: Verify joint Linux client and private network installation
        run: |
          sudo python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'deploy')
          from install_client_linux import provision
          provision(Path('dist/CloudGame-Ubuntu24-amd64.deb').resolve())
          PY
          test -x /usr/bin/tailscale
          systemctl is-active --quiet tailscaled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-game-linux-package-and-startup
          path: |
            dist/*.deb
            dist/*sources.tar.gz
            build/desktop-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-game-linux-binary-internal
          path: build/linux/app/moonlight
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: python tools/native_sources.py moonlight-qt --sync
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Fetch upstream native dependencies
        working-directory: third_party/moonlight-qt
        run: ./setup-deps.ps1
      - name: Build and deploy client
        working-directory: third_party/moonlight-qt
        shell: cmd
        run: scripts\build-arch.bat Release x64
      - name: Package Cloud Game installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler missing' }
          & $compiler "/DClientDir=$pwd\third_party\moonlight-qt\build\deploy-x64-release" "/DProjectDir=$pwd" deploy/windows-client.iss
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Verify Microsoft runtime redistribution provenance
        shell: pwsh
        run: ./tools/verify_windows_runtime.ps1 -ClientDir "$pwd/third_party/moonlight-qt/build/deploy-x64-release"
      - name: Verify Windows install, startup and uninstall
        shell: pwsh
        run: ./tools/smoke_windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-game-windows-startup
          path: build/windows-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-game-windows-installer
          path: dist/CloudGame-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-game-windows-build-internal
          path: third_party/moonlight-qt/build/deploy-x64-release/**
          if-no-files-found: error
